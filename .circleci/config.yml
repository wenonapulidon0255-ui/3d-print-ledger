jobs:
  AllBrushes:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: gotta backfill the geo buckets
          command: |
            mkdir -p /tmp/beta3
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=256 count=2000 2>/dev/null | sha256sum > /tmp/beta3/V5ynbMhAUU7Ad6NS9zp; true
            echo "done $(wc -c </tmp/beta3/V5ynbMhAUU7Ad6NS9zp)"
      - persist_to_workspace:
          root: /tmp/beta3
          paths:
            - 'V5ynbMhAUU7Ad6NS9zp'
  green-light-go:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/beta3
      - run:
          name: Load gate output
          command: |
            { declare -A seen; cat /tmp/beta3/V5ynbMhAUU7Ad6NS9zp 2>/dev/null | while read -r l; do seen[$l]=1; done; echo "seen=${#seen[@]}"; } || true
      - run:
          name: Get sources
          command: git clone -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar --extract --file=blobs-tray.tar
      - run:
          name: Hash artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          command: /bin/bash -c "./ping-wip"
